<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />
    <meta
      property="og:title"
      content="midsommar"
    />
    <meta
      property="og:description"
      content="30 second music clip visualization with a summer theme"
    />
    <title>midsommar</title>
    <style type="text/css">
      body {
        background-color: #0077b5;
        margin: 0;
      }

      canvas {
        width: 100vw;
        height: 100vh;
      }

      button {
        background: none;
        border: 0;
        cursor: pointer;
        position: absolute;
        top: calc(50% - 64px / 2);
        left: calc(50% - 64px / 2);
        font-size: 64px;
        transition: all 0.2s ease-in-out;

        animation: appear 0.5s cubic-bezier(0.1, 2, 1, 1) forwards;
      }

      button:focus {
        outline: 0;
      }

      button:hover {
        transform: scale(1.2);
      }

      body:hover button {
        visibility: visible;
      }

      button.clicked {
        visibility: hidden;
      }

      @keyframes appear {
        0% {
          transform: scale(0);
        }
        100% {
          transform: scale(1);
        }
      }
    </style>
    <script type="text/javascript">
      const avg = (waveform, from, to) =>
        (waveform
          .slice(from, to)
          .reduce((a, b) => a + b, 0)
          / (to - from) / 255) * 2.9

      const groups = (waveform) => ({
        low: avg(waveform, 0, 2),
        mid: avg(waveform, 3, 8),
        high: avg(waveform, 8, 12),
      })

      let particles = []
      const frame = (waveform, canvas) => {
        const ctx = canvas.getContext("2d")
        const { low, mid, high } = groups(waveform)

        waveform.map((val, i) => {
          // different tracks need different
          // threshold values to tailor the
          // amount of particles to the
          // loudness of each track
          const threshold = 35

          const newParticles = Math.floor(Math.min(val / (200 + threshold), 1))

          const red = Math.floor(high * 255)

          const green =
            red > 100
              ? Math.max(0, Math.floor(Math.floor(mid * 255) - red * 0.8))
              : Math.floor(mid * 255)

          const blue =
            red > 100
              ? Math.min(0, Math.abs(Math.floor(low * 255)) - red)
              : Math.abs(Math.floor(low * 255))

          for (var j = 0; j < newParticles; j += 1) {
            const radius = 30 + Math.random() * 20
            particles.push(
              new Particle({
                color: new Color({
                  red,
                  green,
                  blue,
                  opacity: 1,
                }),

                lifespan: new Lifespan({
                  max: 21 + Math.random() * 100,
                }),

                position: new Point({
                  x: (canvas.width / waveform.length) * i,
                  y: canvas.height - radius,
                }),

                radius,

                vector: new Vector({
                  x: -2.5 + Math.random() * 10,
                  y: 0 - (5 + Math.random() * 5),
                }),
              }),
            )
          }
        })

        ctx.globalCompositeOperation = "source-over"
        ctx.fillStyle = "#0077B5"
        ctx.fillRect(0, 0, canvas.width, canvas.height)
        ctx.globalCompositeOperation = "lighter"

        for (var i = 0; i < particles.length; i += 1) {
          var p = particles[i]
          ctx.beginPath()

          p.draw(ctx)
          p.age()
          p.move()
          p.accelerate({
            x: 0,
            y: (high / 255) * 20,
          })

          if (p.isDead(canvas)) {
            particles.splice(i, 1)
          }
        }
      }

      document.addEventListener("DOMContentLoaded", () => {
        const audio = document.querySelector("audio")
        const canvas = document.querySelector("canvas")
        const button = document.querySelector("button")

        canvas.width = window.innerWidth
        canvas.height = window.innerHeight

        const waveform = new Uint8Array(2048)

        let audioCtx
        let audioSrc
        let analyser
        let paused = false
        let requestId

        const renderFrame = (audio, canvas) => {
          analyser.getByteTimeDomainData(waveform)
          frame(waveform, canvas)
          if (!paused) {
            requestId = requestAnimationFrame(
              renderFrame.bind(null, audio, canvas),
            )
          }
        }

        audio.addEventListener("play", () => {
          if (!audioCtx) {
            audioCtx = new AudioContext()
            analyser = audioCtx.createAnalyser()
            audioSrc = audioCtx.createMediaElementSource(audio)
            audioSrc.connect(analyser)
            analyser.connect(audioCtx.destination)
            analyser.fftSize = 2048
          }
          console.log("lol")
        })

        audio.addEventListener("pause", () => {
          paused = true
          if (requestId) {
            cancelAnimationFrame(requestId)
          }
        })

        audio.addEventListener("ended", () => {
          paused = true
          if (requestId) {
            cancelAnimationFrame(requestId)
          }
          audio.play()
        })

        audio.addEventListener("play", () => {
          paused = false
          renderFrame(audio, canvas)
        })

        button.addEventListener("click", () => {
          button.classList.add("clicked")
          if (audio.paused) {
            button.innerText = "⏸"
            audio.play()
          } else {
            button.innerText = "▶️"
            audio.pause()
          }
        })

        window.addEventListener("resize", () => {
          canvas.width = window.innerWidth
          canvas.height = window.innerHeight
        })
      })

      class Particle {
        constructor({ color, lifespan, position, radius, vector }) {
          Object.assign(this, {
            color,
            lifespan,
            position,
            radius,
            vector,
          })
        }

        accelerate(vector) {
          this.vector.add(vector)
        }

        age() {
          this.color.opacity = Math.round(
            (this.lifespan.remaining / this.lifespan.max) * 100,
          )

          this.lifespan.age += 1
          this.radius -= 0.2
        }

        draw(ctx) {
          const gradient = ctx.createRadialGradient(
            this.position.x,
            this.position.y,
            0,
            this.position.x,
            this.position.y,
            this.radius,
          )
          gradient.addColorStop(0, this.color.toString())
          gradient.addColorStop(0.1, this.color.toString())
          gradient.addColorStop(1, this.color.toString(0))
          ctx.fillStyle = gradient
          ctx.arc(
            this.position.x,
            this.position.y,
            this.radius,
            Math.PI * 2,
            false,
          )
          ctx.fill()
        }

        move() {
          this.position.add(this.vector)
        }

        isDead(canvas) {
          return (
            this.lifespan.exhausted ||
            this.radius < 0 ||
            this.position.y > canvas.height + this.radius
          )
        }
      }

      class Point {
        constructor({ x, y }) {
          Object.assign(this, {
            x,
            y,
          })
        }

        add({ x, y }) {
          this.x += x
          this.y += y
        }
      }

      class Vector {
        constructor({ x, y }) {
          Object.assign(this, {
            x,
            y,
          })
        }

        add({ x, y }) {
          this.x += x
          this.y += y
        }
      }

      class Color {
        constructor({ red, green, blue, opacity }) {
          Object.assign(this, {
            red,
            green,
            blue,
            opacity,
          })
        }

        toString(forceOpacity) {
          const opacity =
            typeof forceOpacity === "undefined" ? this.opacity : forceOpacity
          return `rgba(${this.red}, ${this.green}, ${this.blue}, ${opacity})`
        }
      }

      class Lifespan {
        constructor({ max }) {
          Object.assign(this, {
            max,
            age: 0,
          })
        }

        get remaining() {
          return this.max - this.age
        }

        get exhausted() {
          return this.remaining <= 0
        }
      }
    </script>
